<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemoryArc Hero</title>

<!-- ======================================================================
     MEMORYARC HERO  |  unique id: memoryarc-x4m9
     Everything is scoped to #memoryarc-x4m9, so it will not clash with
     any other CSS/JS on your website.

     HOW TO ADD TO ANOTHER WEBSITE
       1) Copy the <style> block   (MEMORYARC CSS)   into your CSS file / <head>
       2) Copy the <section id="memoryarc-x4m9">     (MEMORYARC HTML) where you want it
       3) Copy the <script> block  (MEMORYARC JS)    before </body>
     ====================================================================== -->

<!-- ============================ MEMORYARC CSS ============================ -->
<style>
#memoryarc-x4m9 {
  --ma-bg: #0d1224;
  --ma-text: #f4f6fb;
  --ma-muted: #c5cad6;
  --ma-accent: #5b4bf5;
  --ma-accent-hover: #6f60ff;
  --ma-card: clamp(70px, 9.6vw, 170px);   /* card width  */
  --ma-text-top: 300px;                   /* set by JS, keeps the text inside the arc */

  position: relative;
  width: 100%;
  min-height: max(46vw, 34rem);
  padding: var(--ma-text-top) 1.25rem 3.5rem;
  background: var(--ma-bg);
  color: var(--ma-text);
  overflow: hidden;
  box-sizing: border-box;
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#memoryarc-x4m9 *, #memoryarc-x4m9 *::before, #memoryarc-x4m9 *::after { box-sizing: border-box; }

/* ---------- the arc of photos ---------- */
#memoryarc-x4m9 .ma-arc {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#memoryarc-x4m9 .ma-card {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--ma-card);
  aspect-ratio: 0.9 / 1;
  pointer-events: auto;
  will-change: transform;
}
#memoryarc-x4m9 .ma-face {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: calc(var(--ma-card) * 0.11);
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .14);
  box-shadow: 0 14px 30px rgba(0, 0, 0, .45);
  background: #1b2238;
  transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s;
  animation: ma-pop .7s cubic-bezier(.2, .8, .2, 1) both;
  animation-delay: calc(var(--i) * 55ms);
}
#memoryarc-x4m9 .ma-face img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
#memoryarc-x4m9 .ma-card:hover { z-index: 50; }
#memoryarc-x4m9 .ma-card:hover .ma-face {
  transform: translateY(-8px) scale(1.06);
  box-shadow: 0 22px 44px rgba(0, 0, 0, .6);
}
@keyframes ma-pop {
  from { opacity: 0; transform: scale(.6); }
  to   { opacity: 1; transform: scale(1); }
}

/* ---------- text ---------- */
#memoryarc-x4m9 .ma-content {
  position: relative;
  z-index: 2;
  max-width: 44rem;
  margin: 0 auto;
  text-align: center;
}
#memoryarc-x4m9 .ma-title {
  margin: 0;
  font-size: clamp(2.1rem, 4.7vw, 4.6rem);
  font-weight: 700;
  line-height: 1.06;
  letter-spacing: -0.025em;
  color: var(--ma-text);
}
#memoryarc-x4m9 .ma-sub {
  margin: 1.1rem auto 0;
  max-width: 34rem;
  font-size: clamp(1rem, 1.5vw, 1.25rem);
  line-height: 1.55;
  color: var(--ma-muted);
}
#memoryarc-x4m9 .ma-actions {
  margin-top: 2.2rem;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .9rem;
}
#memoryarc-x4m9 .ma-btn {
  display: inline-block;
  padding: .85rem 1.9rem;
  border-radius: 999px;
  font: 500 1.05rem/1.2 inherit;
  font-family: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: background .25s, border-color .25s, transform .25s;
}
#memoryarc-x4m9 .ma-btn--primary {
  background: var(--ma-accent);
  color: #fff;
  border: 1px solid var(--ma-accent);
}
#memoryarc-x4m9 .ma-btn--primary:hover { background: var(--ma-accent-hover); transform: translateY(-2px); }
#memoryarc-x4m9 .ma-btn--ghost {
  background: rgba(255, 255, 255, .03);
  color: var(--ma-text);
  border: 1px solid rgba(255, 255, 255, .28);
}
#memoryarc-x4m9 .ma-btn--ghost:hover { border-color: rgba(255, 255, 255, .6); transform: translateY(-2px); }
#memoryarc-x4m9 .ma-btn:focus-visible { outline: 3px solid #9d93ff; outline-offset: 3px; }

@media (max-width: 700px) {
  #memoryarc-x4m9 { --ma-card: 15vw; min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  #memoryarc-x4m9 .ma-face { animation: none; transition: none; }
}
</style>
</head>

<body style="margin:0;background:#000">

<!-- ============================ MEMORYARC HTML =========================== -->
<section id="memoryarc-x4m9" aria-labelledby="memoryarc-x4m9-title">

  <!-- 12 photos, placed on the arc automatically (left -> right).
       To use a real photo: put <img src="your.jpg" alt="..."> inside .ma-face and delete the inline background.
       Add/remove cards freely - the arc re-spaces itself. -->
  <div class="ma-arc" aria-hidden="true">
    <div class="ma-card" style="--i:0"><div class="ma-face" style="background:linear-gradient(135deg,#3d6b6a,#c9b48a 50%,#2a4a55)"></div></div>
    <div class="ma-card" style="--i:1"><div class="ma-face" style="background:linear-gradient(180deg,#6fa8d6,#cfe3ee 50%,#d9a98a)"></div></div>
    <div class="ma-card" style="--i:2"><div class="ma-face" style="background:linear-gradient(160deg,#dcdcdc,#8a8f96 45%,#2c3036)"></div></div>
    <div class="ma-card" style="--i:3"><div class="ma-face" style="background:radial-gradient(circle at 50% 45%,#f2c9a0,#b57a4a 55%,#4d6b2f)"></div></div>
    <div class="ma-card" style="--i:4"><div class="ma-face" style="background:linear-gradient(150deg,#d8c7ab,#8f7b62 55%,#4b3e35)"></div></div>
    <div class="ma-card" style="--i:5"><div class="ma-face" style="background:linear-gradient(160deg,#f0f0f0,#7b7b7b 50%,#121212)"></div></div>
    <div class="ma-card" style="--i:6"><div class="ma-face" style="background:linear-gradient(170deg,#3f7d3a,#9cc7a0 45%,#1d4a2b)"></div></div>
    <div class="ma-card" style="--i:7"><div class="ma-face" style="background:linear-gradient(140deg,#0e2a6b,#19d3c5 45%,#8a3ffc)"></div></div>
    <div class="ma-card" style="--i:8"><div class="ma-face" style="background:linear-gradient(180deg,#8bbf3f,#f0d9a8 60%,#d8a95d)"></div></div>
    <div class="ma-card" style="--i:9"><div class="ma-face" style="background:linear-gradient(160deg,#c9835d,#7d4c3a 55%,#48586b)"></div></div>
    <div class="ma-card" style="--i:10"><div class="ma-face" style="background:linear-gradient(180deg,#0c1533,#25406f 55%,#d9743a)"></div></div>
    <div class="ma-card" style="--i:11"><div class="ma-face" style="background:linear-gradient(150deg,#e8dfcf,#c98b4f 50%,#1f2a26)"></div></div>
  </div>

  <div class="ma-content">
    <h1 class="ma-title" id="memoryarc-x4m9-title">Rediscover Your Memories with AI</h1>
    <p class="ma-sub">Our intelligent platform finds, organizes, and brings your most cherished moments back to life.</p>
    <div class="ma-actions">
      <a class="ma-btn ma-btn--primary" href="#">Explore Your Past</a>
      <a class="ma-btn ma-btn--ghost" href="#">How It Works</a>
    </div>
  </div>

</section>

<!-- ============================= MEMORYARC JS ============================ -->
<script>
(function () {
  'use strict';

  var root = document.getElementById('memoryarc-x4m9');
  if (!root || root.getAttribute('data-ma-ready')) return;
  root.setAttribute('data-ma-ready', '1');

  var cards = Array.prototype.slice.call(root.querySelectorAll('.ma-card'));
  var N = cards.length;
  if (!N) return;

  /* ---- shape of the arc (all values are a fraction of the section width) ---- */
  var CFG = {
    radiusX: 0.355,     // arc half-width
    radiusY: 0.25,      // arc height
    topPad:  0.057,     // space above the highest card
    rotStart: 38,       // tilt of the left-most card (deg)
    rotEnd:   8         // tilt of the right-most card (deg)
  };

  function layout() {
    var W = root.clientWidth;
    var small = W < 700;
    var rx = W * (small ? 0.41 : CFG.radiusX);
    var ry = W * (small ? 0.36 : CFG.radiusY);
    var cw = cards[0].offsetWidth;
    var ch = cards[0].offsetHeight;
    var cx = W / 2;
    var cy = ry + (small ? cw * 0.6 : W * CFG.topPad);

    for (var i = 0; i < N; i++) {
      var t = N > 1 ? i / (N - 1) : 0.5;              // 0 = left end, 1 = right end
      var theta = Math.PI * (1 - t);                  // half circle, left -> over the top -> right
      var x = cx + rx * Math.cos(theta) - cw / 2;
      var y = cy - ry * Math.sin(theta) - ch / 2;
      var rot = CFG.rotStart + (CFG.rotEnd - CFG.rotStart) * t;
      cards[i].style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' + rot.toFixed(1) + 'deg)';
    }

    /* push the text down so it sits inside the arc */
    root.style.setProperty('--ma-text-top', Math.round(small ? cy + ch * 0.75 : cy - W * 0.07) + 'px');
  }

  layout();
  if ('ResizeObserver' in window) {
    new ResizeObserver(layout).observe(root);
  } else {
    window.addEventListener('resize', layout);
  }
})();
</script>

</body>
</html>
