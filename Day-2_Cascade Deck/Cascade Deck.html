<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Stack Slider</title>
<style>
  :root {
    --bg: #fbfaf7;
    --ink: #111;
    --mute: #9a9a95;
    --w: clamp(220px, 58vmin, 340px);
    --h: calc(var(--w) * 0.56);
    --fall: .8s;
    --ease-out: cubic-bezier(.22, .9, .24, 1);
    --ease-fall: cubic-bezier(.55, .05, .35, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --ink: #f2f1ec; --mute: #77776f; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }

  /* soft shade at the top, like the recording */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto 0; height: 70px; z-index: 5; pointer-events: none;
    background: linear-gradient(rgba(0,0,0,.22), transparent);
  }

  .label {
    position: fixed; top: calc(20px + env(safe-area-inset-top, 0px)); left: 0; right: 0;
    text-align: center; z-index: 6; pointer-events: none;
    transition: opacity .22s ease, filter .22s ease, transform .22s ease;
  }
  .label.swap { opacity: 0; filter: blur(4px); transform: translateY(-4px); }
  .label small { display: block; font-size: 9px; letter-spacing: .32em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
  .label strong { font-size: 13px; font-weight: 600; letter-spacing: .01em; }

  .scene {
    position: absolute; left: 50%; top: 60%;
    width: var(--w); height: var(--h);
    transform: translate(-50%, -50%);
    perspective: 900px; perspective-origin: 50% -30%;
  }
  .stack { position: absolute; inset: 0; transform-style: preserve-3d; }

  .floor {
    position: absolute; left: 4%; right: 4%; top: 108%; height: 85%;
    background: linear-gradient(rgba(0,0,0,.30), transparent);
    filter: blur(14px); border-radius: 18px; opacity: .55; pointer-events: none;
  }

  .slot {
    position: absolute; inset: 0;
    transform-origin: 50% 100%;
    transform-style: preserve-3d;
    cursor: pointer;
    transition:
      transform var(--fall) var(--ease-out) var(--d, 0s),
      opacity .25s ease var(--d, 0s);
    will-change: transform, opacity;
    outline: none;
  }
  .slot.is-fallen {
    pointer-events: none;
    transition:
      transform var(--fall) var(--ease-fall) var(--d, 0s),
      opacity .35s ease calc(var(--d, 0s) + .32s);
  }
  .slot.is-hidden { pointer-events: none; }

  .face {
    position: absolute; inset: 0; border-radius: 16px; overflow: hidden;
    box-shadow: 0 -1px 0 rgba(255,255,255,.35), 0 14px 26px -14px rgba(0,0,0,.45);
    transition: transform .45s var(--ease-out), filter .45s ease;
  }
  .slot:not(.is-front):not(.is-fallen):hover .face,
  .slot:not(.is-front):not(.is-fallen):focus-visible .face { transform: translateY(-10px); filter: brightness(1.06); }
  .slot:focus-visible .face { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* dots */
  .dots { position: fixed; right: 14px; top: 58%; transform: translateY(-50%); z-index: 6; display: grid; gap: 7px; padding: 8px 6px; }
  .dots button { all: unset; cursor: pointer; width: 3px; height: 3px; border-radius: 50%; background: var(--mute); opacity: .55; }
  .dots button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .dots i {
    position: absolute; left: 50%; top: 8px; width: 5px; height: 5px; margin-left: -2.5px; margin-top: -1px;
    border-radius: 50%; background: var(--ink);
    transition: transform .6s var(--ease-out);
  }

  /* poster finish: film grain + soft gloss */
  .face svg { display: block; width: 100%; height: 100%; }
  .face::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .32;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .face::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,.24), transparent 38%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --fall: .01s; }
    .slot, .face, .dots i, .label { transition-duration: .01s !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>

<div class="label" id="label" aria-live="polite"><small id="brand"></small><strong id="title"></strong></div>

<div class="scene">
  <div class="floor"></div>
  <div class="stack" id="stack"></div>
</div>

<nav class="dots" id="dots" aria-label="Slides"><i id="marker"></i></nav>

<script>
(() => {
  const ITEMS = [
    { brand: "Gradient Studio",  title: "Spectrum" },
    { brand: "Chromatic",        title: "Velvet" },
    { brand: "Line Form",        title: "Stripes" },
    { brand: "Soleil",           title: "Warmth" },
    { brand: "Ocean Archive",    title: "Tidal" },
    { brand: "Meridian",         title: "Sands of Time" },
    { brand: "Alpine Collective",title: "Summit" },
    { brand: "Violet House",     title: "Dusk" },
    { brand: "Pastel Lab",       title: "Opal" },
    { brand: "Hearth & Co",      title: "Ember" }
  ];
  const N = ITEMS.length;

  const AUTO_MS = 3000;  // auto change every 3 seconds
  const GAP_Y = 15, GAP_Z = 62, TILT = -3, STAGGER = 0.07;

  const stack  = document.getElementById("stack");
  const dotsEl = document.getElementById("dots");
  const marker = document.getElementById("marker");
  const label  = document.getElementById("label");
  const brandEl = document.getElementById("brand");
  const titleEl = document.getElementById("title");

  let current = 0;               // virtual index, keeps growing -> endless loop
  const pos = ITEMS.map((_, i) => i);   // virtual position of every card
  let swiped = false;

  /* ---------- posters (inline SVG, no images needed) ---------- */
  const SANS = "Helvetica Neue,Arial,sans-serif", SERIF = "Georgia,'Times New Roman',serif";
  const svg = body => `<svg viewBox="0 0 340 190" preserveAspectRatio="xMidYMid slice">${body}</svg>`;
  const blur = (id, n) => `<filter id="${id}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${n}"/></filter>`;
  const arcs = (cx, cy, rs, f) => rs.map((r, i) => f(r, i, `<circle cx="${cx}" cy="${cy}" r="${r}"`)).join("");

  const POSTERS = [
    // 1 Spectrum: blurred colour field
    () => svg(`<defs>${blur("p1", 22)}</defs><rect width="340" height="190" fill="#ff3d8f"/>
      <g filter="url(#p1)"><circle cx="250" cy="15" r="72" fill="#ffd23a"/><circle cx="35" cy="195" r="95" fill="#7b2ff7"/>
      <circle cx="310" cy="175" r="70" fill="#ff6a3d"/><circle cx="115" cy="35" r="50" fill="#ff9ad0"/></g>
      <text x="18" y="170" font-size="36" font-weight="800" letter-spacing="-1.8" fill="#fff" font-family="${SANS}">spectrum</text>
      <text x="20" y="24" font-size="7" letter-spacing="3" fill="#fff" font-family="${SANS}">NO. 01</text>`),

    // 2 Velvet: pleated light
    () => svg(`<defs><linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c06fb8"/><stop offset=".55" stop-color="#6f86d0"/><stop offset="1" stop-color="#1783c9"/></linearGradient>
      <pattern id="p2s" width="9" height="190" patternUnits="userSpaceOnUse"><rect width="3" height="190" fill="#fff" opacity=".14"/></pattern></defs>
      <rect width="340" height="190" fill="url(#p2)"/><rect width="340" height="190" fill="url(#p2s)"/>
      <circle cx="255" cy="88" r="58" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>
      <circle cx="255" cy="88" r="36" fill="#fff" fill-opacity=".12"/>
      <text x="20" y="168" font-size="40" font-style="italic" fill="#fff" font-family="${SERIF}">Velvet</text>`),

    // 3 Stripes: concentric arcs
    () => svg(`<rect width="340" height="190" fill="#17312c"/>` +
      arcs(170, -30, [240,205,170,135,100,65,32], (r, i, c) => `${c} fill="${["#17312c","#f7cfa8","#ec8a3c","#c4491a","#f7cfa8","#ec8a3c","#17312c"][i]}"/>`) +
      `<text x="20" y="176" font-size="8" letter-spacing="4" fill="#f7cfa8" font-family="${SANS}">LINE FORM</text>
       <text x="320" y="176" font-size="8" letter-spacing="2" text-anchor="end" fill="#f7cfa8" font-family="${SANS}">03</text>`),

    // 4 Warmth: overlapping suns
    () => svg(`<rect width="340" height="190" fill="#ffd9a8"/>
      <circle cx="140" cy="92" r="68" fill="#ffd400"/>
      <circle cx="205" cy="92" r="68" fill="#ff3fa4" style="mix-blend-mode:multiply"/>
      <circle cx="172" cy="92" r="96" fill="none" stroke="#5a1d12" stroke-opacity=".5" stroke-width=".8"/>
      <text x="20" y="176" font-size="30" font-style="italic" fill="#5a1d12" font-family="${SERIF}">Warmth</text>`),

    // 5 Tidal: wave lines + foam
    () => svg(`<defs><linearGradient id="p5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#082d30"/><stop offset=".7" stop-color="#14706a"/><stop offset="1" stop-color="#eaf6f5"/></linearGradient></defs>
      <rect width="340" height="190" fill="url(#p5)"/>` +
      Array.from({length: 9}, (_, i) => `<path d="M-10 ${58+i*14} q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#fff" stroke-opacity="${.1+i*.09}" stroke-width="${1+i*.45}"/>`).join("") +
      `<text x="20" y="34" font-size="34" font-weight="300" letter-spacing="6" fill="#fff" font-family="${SANS}">TIDAL</text>`),

    // 6 Sands of Time: desert sunset
    () => svg(`<defs><linearGradient id="p6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6fa8"/><stop offset=".5" stop-color="#f4a35c"/><stop offset="1" stop-color="#ffd08a"/></linearGradient></defs>
      <rect width="340" height="190" fill="url(#p6)"/><circle cx="235" cy="92" r="30" fill="#ffeab5"/>
      <path d="M0 140 Q60 105 130 135 T250 128 T340 120 V190 H0Z" fill="#d9622f"/>
      <path d="M0 158 Q80 128 160 154 T340 148 V190 H0Z" fill="#a83c1b"/>
      <path d="M0 176 Q90 156 180 174 T340 170 V190 H0Z" fill="#6b230f"/>
      <text x="20" y="26" font-size="8" letter-spacing="4" fill="#fff" font-family="${SANS}">MERIDIAN</text>`),

    // 7 Summit: misty peaks
    () => svg(`<defs><linearGradient id="p7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dde5f4"/><stop offset="1" stop-color="#f8f9fd"/></linearGradient>
      <linearGradient id="p7f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></linearGradient></defs>
      <rect width="340" height="190" fill="url(#p7)"/>
      <polygon points="0,190 0,125 70,62 118,112 192,36 272,118 312,88 340,112 340,190" fill="#8795b4"/>
      <polygon points="192,36 170,62 186,58 196,70 210,56" fill="#fff"/><polygon points="70,62 56,80 68,76 78,86 88,76" fill="#fff"/>
      <polygon points="0,190 0,152 92,102 162,152 232,98 340,162 340,190" fill="#c3cce0"/>
      <rect y="100" width="340" height="90" fill="url(#p7f)"/>
      <text x="170" y="172" font-size="14" letter-spacing="9" text-anchor="middle" fill="#2f3b5c" font-family="${SANS}">SUMMIT</text>`),

    // 8 Dusk: neon arcs and moon
    () => svg(`<defs>${blur("p8", 3)}</defs><rect width="340" height="190" fill="#130a33"/>
      <g filter="url(#p8)" opacity=".9">` + arcs(40, 215, [40,62,84,106,128,150,172,194,216], (r, i, c) => `${c} fill="none" stroke="#9a66ff" stroke-width="2.4"/>`) + `</g>` +
      arcs(40, 215, [40,62,84,106,128,150,172,194,216], (r, i, c) => `${c} fill="none" stroke="#c9a9ff" stroke-width="1"/>`) +
      `<circle cx="276" cy="52" r="26" fill="#ffd9a0" opacity=".18"/><circle cx="276" cy="52" r="15" fill="#fff3d6"/>
      <text x="320" y="176" font-size="30" font-weight="200" text-anchor="end" fill="#e6dcff" font-family="${SANS}">dusk</text>`),

    // 9 Opal: iridescent glass
    () => svg(`<defs>${blur("p9", 20)}</defs><rect width="340" height="190" fill="#f5f1ec"/>
      <g filter="url(#p9)"><ellipse cx="90" cy="70" rx="80" ry="55" fill="#ffb0d8"/><ellipse cx="235" cy="55" rx="75" ry="50" fill="#85e8ff"/>
      <ellipse cx="170" cy="140" rx="90" ry="45" fill="#c7a4ff"/><ellipse cx="300" cy="150" rx="55" ry="40" fill="#b6ffd6"/></g>
      <circle cx="170" cy="92" r="46" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".8"/>
      <text x="170" y="172" font-size="12" letter-spacing="12" text-anchor="middle" fill="#3b3350" font-family="${SANS}">OPAL</text>`),

    // 10 Ember: bauhaus
    () => svg(`<rect width="340" height="190" fill="#e9462b"/><rect x="214" width="126" height="190" fill="#0c3c96"/>
      <circle cx="120" cy="92" r="58" fill="#f6e7c8"/><path d="M62 92 a58 58 0 0 0 116 0Z" fill="#141414"/>
      <rect x="236" y="26" width="34" height="34" fill="#ffc21a"/><circle cx="300" cy="150" r="14" fill="#f6e7c8"/>
      <text x="20" y="176" font-size="22" font-weight="800" letter-spacing="-.5" fill="#141414" font-family="${SANS}">ember</text>`)
  ];

  const slots = ITEMS.map((it, i) => {
    const s = document.createElement("div");
    s.className = "slot";
    s.setAttribute("role", "button");
    s.setAttribute("aria-label", `${it.title} by ${it.brand}`);
    s.innerHTML = `<div class="face">${POSTERS[i]()}</div>`;
    s.addEventListener("click", () => {
      const d = pos[i] - current;
      if (!swiped && d > 0) advance(d);
    });
    s.addEventListener("keydown", e => { if (e.key === "Enter") s.click(); });
    stack.appendChild(s);
    return s;
  });

  ITEMS.forEach((it, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-label", `Go to ${it.title}`);
    b.addEventListener("click", () => advance(((i - current) % N + N) % N));
    dotsEl.appendChild(b);
  });

  const backTransform = k => `translate3d(0, ${-k * GAP_Y}px, ${-k * GAP_Z}px) rotateX(${TILT}deg)`;
  const FALLEN = "translate3d(0, 130px, 70px) rotateX(-88deg)";

  function place(s, d, delay) {
    s.classList.remove("is-fallen");
    s.classList.toggle("is-front", d === 0);
    s.style.transform = backTransform(d);
    s.style.opacity = "1";
    s.style.setProperty("--d", delay.toFixed(3) + "s");
    s.tabIndex = d === 0 ? 0 : -1;
  }
  function fall(s, delay) {
    if (!s.classList.contains("is-fallen")) s._t = performance.now() + delay * 1000;
    s.classList.add("is-fallen");
    s.classList.remove("is-front");
    s.style.transform = FALLEN;
    s.style.opacity = "0";
    s.style.setProperty("--d", delay.toFixed(3) + "s");
    s.tabIndex = -1;
  }
  const instant = (s, fn) => {           // apply a change without animating it
    s.style.transition = "none"; fn(); void s.offsetWidth; s.style.transition = "";
  };

  function render(from, to) {
    const forward = to >= from;
    let maxDelay = 0;
    slots.forEach((s, i) => {
      const p = pos[i], d = p - to;
      let delay = 0;
      if (d < 0) {
        if (forward && p >= from) delay = (p - from) * STAGGER;
        fall(s, delay);
      } else {
        if (!forward && p < from) delay = (from - 1 - p) * STAGGER;
        else if (forward) delay = 0.08 + d * 0.012;
        place(s, d, delay);
      }
      maxDelay = Math.max(maxDelay, delay);
    });

    const step = dotsEl.children[1].offsetTop - dotsEl.children[0].offsetTop;
    const idx = ((to % N) + N) % N;
    marker.style.transform = `translateY(${idx * step}px)`;
    dotsEl.querySelectorAll("button").forEach((b, i) => b.style.opacity = i === idx ? 0 : .55);
    setLabel(idx);
    setTimeout(recycle, maxDelay * 1000 + 800);
  }

  // cards that already fell away re-enter at the back of the stack
  function recycle() {
    const now = performance.now();
    slots.forEach((s, i) => {
      if (pos[i] >= current || now < (s._t || 0) + 750) return;
      pos[i] += N * Math.ceil((current - pos[i]) / N);
      const d = pos[i] - current;
      instant(s, () => {
        s.classList.remove("is-fallen");
        s.style.opacity = "0";
        s.style.transform = backTransform(d + 1);   // starts one step deeper
        s.style.setProperty("--d", "0s");
      });
      place(s, d, 0);                                 // then fades/moves into place
    });
  }

  let labelTimer;
  function setLabel(i) {
    clearTimeout(labelTimer);
    label.classList.add("swap");
    labelTimer = setTimeout(() => {
      brandEl.textContent = ITEMS[i].brand;
      titleEl.textContent = ITEMS[i].title;
      label.classList.remove("swap");
    }, 200);
  }

  function advance(n) {
    if (n <= 0) return;
    const prev = current;
    current += n;
    render(prev, current);
    restartAuto();
  }
  function back() {
    const t = current - 1;
    const idx = ((t % N) + N) % N;
    if (pos[idx] > t) {                              // card is at the back: bring it round to the fallen spot
      pos[idx] = t;
      instant(slots[idx], () => fall(slots[idx], 0));
    }
    const prev = current;
    current = t;
    render(prev, current);
    restartAuto();
  }

  /* auto change */
  let auto;
  function restartAuto() {
    clearTimeout(auto);
    auto = setTimeout(() => advance(1), AUTO_MS);
  }
  document.addEventListener("visibilitychange", () => {
    document.hidden ? clearTimeout(auto) : restartAuto();
  });

  /* wheel / trackpad */
  let acc = 0, lock = false, lastWheel = 0;
  window.addEventListener("wheel", e => {
    e.preventDefault();
    const now = performance.now();
    if (now - lastWheel > 160) acc = 0;
    lastWheel = now;
    if (lock) return;
    acc += e.deltaY;
    if (Math.abs(acc) > 36) {
      acc > 0 ? advance(1) : back();
      acc = 0; lock = true;
      setTimeout(() => lock = false, 650);
    }
  }, { passive: false });

  /* touch swipe */
  let y0 = null;
  window.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; swiped = false; }, { passive: true });
  window.addEventListener("touchend", e => {
    if (y0 === null) return;
    const dy = y0 - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 40) { swiped = true; dy > 0 ? advance(1) : back(); setTimeout(() => swiped = false, 350); }
    y0 = null;
  }, { passive: true });

  /* keyboard */
  window.addEventListener("keydown", e => {
    if (["ArrowDown", "ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); advance(1); }
    if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); back(); }
  });

  /* initial state, no animation */
  slots.forEach(s => s.style.transition = "none");
  slots.forEach((s, i) => place(s, i, 0));
  marker.style.transform = "translateY(0)";
  dotsEl.children[1].parentElement.querySelectorAll("button")[0].style.opacity = 0;
  brandEl.textContent = ITEMS[0].brand;
  titleEl.textContent = ITEMS[0].title;
  label.classList.remove("swap");
  requestAnimationFrame(() => requestAnimationFrame(() => slots.forEach(s => s.style.transition = "")));
  restartAuto();
})();
</script>
</body>
</html>
