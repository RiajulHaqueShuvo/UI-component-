<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Every frame, brought into focus.</title>
  <link rel="stylesheet" href="image-focus.css" />
</head>
<body>

  <!-- Everything lives inside #img-focus, so it won't clash with other code -->
  <section id="img-focus" aria-label="Image carousel">
    <h1 class="if-title">Every frame,<br />brought into focus.</h1>

    <!-- cards are generated by image-focus.js -->
    <div class="if-stage"></div>

    <p class="if-sub">
      Images curve in from one edge, flatten out at the centre,
      then fade away round the other.
    </p>
  </section>

  <script src="image-focus.js"></script>
</body>
</html>
