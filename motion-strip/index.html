<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Montra</title>
  <link rel="stylesheet" href="motion-strip.css" />
</head>
<body>

  <!-- Everything lives inside #motion-strip, so it won't clash with other code -->
  <section id="motion-strip" tabindex="0" aria-label="Featured gallery">

    <!-- full-screen backgrounds (generated by motion-strip.js) -->
    <div class="ms-bgs"></div>
    <div class="ms-shade"></div>

    <!-- top nav -->
    <nav class="ms-nav">
      <a class="ms-back" href="#">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
          <path d="M11 11 5 5m0 0v5m0-5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </a>
      <a class="ms-brand" href="#">MONTRA</a>
      <a class="ms-menu" href="#">Menu <span aria-hidden="true">&#9776;</span></a>
    </nav>

    <!-- title + details row -->
    <div class="ms-row">
      <h2 class="ms-title"></h2>
      <p class="ms-by ms-mono"></p>
      <div class="ms-meta ms-mono">
        <span class="ms-date"></span>
        <span class="ms-time"></span>
        <span class="ms-city"></span>
      </div>
    </div>

    <!-- thumbnail strip (generated by motion-strip.js) -->
    <div class="ms-strip"></div>

    <!-- counter + progress -->
    <div class="ms-count">
      <div class="ms-nums ms-mono"><span class="ms-cur">01</span><span class="ms-total">09</span></div>
      <div class="ms-bar"><i></i></div>
    </div>
  </section>

  <script src="motion-strip.js"></script>
</body>
</html>
