<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll to Topple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tall area: its height gives you room to scroll -->
  <main class="scroll-area" id="scrollArea">

    <!-- Sticky stage: stays on screen while you scroll -->
    <section class="stage">

      <header class="intro">
        <h1>Scroll to topple</h1>
        <p>Cards stand like dominoes and fall one after another as you scroll; scroll back up and they rise.</p>
      </header>

      <div class="row" id="row">
        <figure class="card"><img src="images/look1.jpg" alt=""><figcaption>Linen &amp; light</figcaption></figure>
        <figure class="card"><img src="images/look2.jpg" alt=""><figcaption>Studio noir</figcaption></figure>
        <figure class="card"><img src="images/look3.jpg" alt=""><figcaption>Crosswalk</figcaption></figure>
        <figure class="card"><img src="images/look4.jpg" alt=""><figcaption>Red thread</figcaption></figure>
        <figure class="card"><img src="images/look5.jpg" alt=""><figcaption>Soft focus</figcaption></figure>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
