<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menagerie Stretch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stretch" id="stretch">

    <div class="card active" tabindex="0">
      <img src="./assets/card1.jpg" alt="Maple">
      <div class="caption"><b>Maple</b><span>Support mascot</span></div>
    </div>

    <div class="card" tabindex="0">
      <img src="./assets/card2.jpg" alt="Mango">
      <div class="caption"><b>Mango</b><span>Product cat</span></div>
    </div>

    <div class="card" tabindex="0">
      <img src="./assets/card3.jpg" alt="Bay">
      <div class="caption"><b>Bay</b><span>Brand mare</span></div>
    </div>

    <div class="card" tabindex="0">
      <img src="./assets/card4.jpg" alt="Leaf">
      <div class="caption"><b>Leaf</b><span>Garden scout</span></div>
    </div>

    <div class="card" tabindex="0">
      <img src="./assets/card5.jpg" alt="Rio">
      <div class="caption"><b>Rio</b><span>Community bird</span></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
