<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit Gallery</title>
  <link rel="stylesheet" href="orbit-gallery.css" />
</head>
<body>

  <!-- Orbit Gallery: everything lives inside #orbit-gallery, so it won't clash with other code -->
  <section id="orbit-gallery" aria-label="Orbit Gallery">
    <h1 class="og-title">Every frame,<br />brought into focus.</h1>

    <!-- cards are generated by orbit-gallery.js -->
    <div class="og-stage"></div>

    <p class="og-sub">
      Images curve in from one edge, flatten out at the centre,
      then fade away round the other.
    </p>
  </section>

  <script src="orbit-gallery.js"></script>
</body>
</html>
