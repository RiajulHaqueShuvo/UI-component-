<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcFlow Slider</title>
<link rel="stylesheet" href="./arcflow-slider.css">
</head>

<body style="margin:0;background:#0b0b0b;color:#cfcfcf;font-family:system-ui,sans-serif">

<!-- ============================ ARCFLOW HTML =========================== -->
<!-- Cards are created by arcflow-slider.js from the ITEMS list.          -->
<div class="af-pin">   <!-- tall wrapper: gives the page room to scroll while the slider stays fixed -->
<section id="arcflow-k7q2" aria-label="Featured collection"
         data-auto-speed="0.35"
         data-pause-ms="3000">

  <!-- Blurred background (two layers so it can cross-fade) -->
  <div class="af-bg" aria-hidden="true">
    <div class="af-bg-layer"></div>
    <div class="af-bg-layer"></div>
    <div class="af-bg-shade"></div>
  </div>

  <div class="af-track"></div>
</section>
</div>

<script src="./arcflow-slider.js"></script>
</body>
</html>
